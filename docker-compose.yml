services:
  postgres:
    image: postgres:16-alpine
    container_name: creatorhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-creatorhub_db}
      POSTGRES_USER: ${DB_USER:-creatorhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-creatorhub_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-creatorhub} -d ${DB_NAME:-creatorhub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - creatorhub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creatorhub-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-creatorhub_db}
      DB_USER: ${DB_USER:-creatorhub}
      DB_PASSWORD: ${DB_PASSWORD:-creatorhub_secret}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-creatorhub_meta_verify_token_2026}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-http://localhost:5173/auth/meta/callback}
      CREATORHUB_META_LIVE_MODE: ${CREATORHUB_META_LIVE_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - creatorhub-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: creatorhub-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - creatorhub-network

  redis:
    image: redis:7-alpine
    container_name: creatorhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - creatorhub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creatorhub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - creatorhub-network

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local

networks:
  creatorhub-network:
    driver: bridge
