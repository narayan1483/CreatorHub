services:
  postgres:
    image: postgres:16-alpine
    container_name: creatorhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-creatorhub_db}
      POSTGRES_USER: ${DB_USER:-creatorhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-creatorhub_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-creatorhub} -d ${DB_NAME:-creatorhub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - creatorhub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creatorhub-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-creatorhub_db}
      DB_USER: ${DB_USER:-creatorhub}
      DB_PASSWORD: ${DB_PASSWORD:-creatorhub_secret}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - creatorhub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creatorhub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - creatorhub-network

volumes:
  postgres_data:
    driver: local

networks:
  creatorhub-network:
    driver: bridge
